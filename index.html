<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Деньги под контролем</title>
<style>
:root{--bg1:#eef0ff;--bg2:#dcd8ff;--c1:rgba(255,255,255,.75);--c2:rgba(255,255,255,.45);--bd:rgba(110,90,220,.25);--tx:#14173a;--tx2:#5b6190;--ac:#7C5CFA;--ac2:#C56BFF;--cy:#43C6F5;--ok:#22a06b;--bad:#e5484d;--glow:rgba(139,92,246,.3);--core:#e9e6ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#080D2B;--bg2:#151A43;--c1:rgba(255,255,255,.09);--c2:rgba(255,255,255,.03);--bd:rgba(150,130,255,.26);--tx:#F5F5FF;--tx2:#9299BD;--ok:#4ade80;--bad:#ff6b6b;--glow:rgba(139,92,246,.5);--core:#0b0b26;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#080D2B;--bg2:#151A43;--c1:rgba(255,255,255,.09);--c2:rgba(255,255,255,.03);--bd:rgba(150,130,255,.26);--tx:#F5F5FF;--tx2:#9299BD;--ok:#4ade80;--bad:#ff6b6b;--glow:rgba(139,92,246,.5);--core:#0b0b26;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 50% 18%,rgba(139,92,246,.28),transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg1) 75%) fixed;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100%}
main{height:100%;overflow-y:auto;padding:12px 18px calc(118px + env(safe-area-inset-bottom,0px));animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(160deg,var(--c1),var(--c2));border:1px solid var(--bd);border-radius:24px;padding:16px;margin-bottom:14px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 34px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.08)}
h1{font-size:24px;font-weight:600;margin:6px 0 14px}h3{margin:0 0 10px;font-size:15px;font-weight:600}
.sec{color:var(--tx2);font-size:13px}.big{font-size:32px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{width:100%;border:0;border-radius:20px;padding:16px;font-size:17px;font-weight:600;color:#fff;background:linear-gradient(90deg,#6D5CFA,#9B5CF6);box-shadow:0 0 26px var(--glow);cursor:pointer}
.btn.ghost{background:linear-gradient(160deg,var(--c1),var(--c2));color:var(--tx);border:1px solid var(--bd);box-shadow:none}
input{width:100%;background:var(--c2);border:1px solid var(--bd);border-radius:14px;padding:12px;color:var(--tx);font-size:16px;margin:4px 0 10px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--c1);color:var(--tx);display:grid;place-items:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{display:grid;place-items:center;margin:2px 0 -6px}.hero svg{width:min(300px,78vw);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:scale(1.04) rotate(2deg)}}
.amt{font-size:42px;font-weight:700;padding:2px 0 12px}
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 74px;border:1px solid var(--bd);border-radius:18px;padding:10px 2px;text-align:center;font-size:11px;background:var(--c2);color:var(--tx2)}
.cat .ci{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 4px;font-size:22px;filter:grayscale(1) brightness(8)}
.cat.on{color:var(--tx);border-color:#A78BFA;background:linear-gradient(160deg,rgba(139,92,246,.45),rgba(139,92,246,.1));box-shadow:0 0 18px var(--glow)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.keys button{padding:11px;font-size:21px;border-radius:16px;border:1px solid var(--bd);background:var(--c2);color:var(--tx)}.keys button:active{background:var(--ac)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(444px,calc(100% - 28px));display:flex;gap:4px;padding:6px;border-radius:32px;background:linear-gradient(160deg,var(--c1),var(--c2));border:1px solid var(--bd);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
nav button{flex:1;border:1px solid transparent;background:none;color:var(--tx2);padding:8px 0 6px;border-radius:26px;font-size:11px;display:grid;justify-items:center;gap:3px}
nav button.on{color:var(--tx);border-color:#B79CFF;background:linear-gradient(180deg,rgba(139,92,246,.3),rgba(139,92,246,.05));box-shadow:0 0 18px var(--glow),inset 0 0 12px rgba(167,139,250,.25)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px}
.tx .m{flex:1;min-width:0}.tx .m div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--tx)}.pos{color:var(--ok)}.del{border:0;background:none;color:var(--tx2);font-size:16px}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;border-radius:6px;transition:width .5s;background:linear-gradient(90deg,#8B5CF6,#C56BFF)}
.seg{display:flex;gap:6px;margin-bottom:12px;padding:4px;border-radius:20px;background:var(--c2);border:1px solid var(--bd)}.seg button{flex:1;padding:8px 2px;border-radius:16px;border:0;background:none;color:var(--tx2);font-size:14px}.seg button.on{background:linear-gradient(90deg,#8B5CF6,#C56BFF);color:#fff;box-shadow:0 0 14px var(--glow)}
.leg{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0}.leg i{width:9px;height:9px;border-radius:50%}.leg span{flex:1}.leg u{text-decoration:none;color:var(--tx2);width:34px;text-align:right}.leg b{width:68px;text-align:right}
.hb{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.hb em{font-style:normal;width:40px;text-align:right}.hb s{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;text-decoration:none}.hb s i{display:block;height:100%;border-radius:5px}.hb span{width:92px;color:var(--tx2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.tiles button{border:1px solid var(--bd);border-radius:20px;padding:14px 4px;background:linear-gradient(160deg,var(--c1),var(--c2));color:var(--tx);font-size:13px;display:grid;justify-items:center;gap:6px}
.lr{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:16px;border:1px solid var(--bd);background:var(--c2);margin-bottom:8px;width:100%;color:var(--tx);font-size:15px}
.lc{border-radius:22px;padding:18px;margin-bottom:12px;color:#fff;border:1px solid var(--bd);min-height:100px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;z-index:20;background:#fff;color:#111;display:grid;place-content:center;justify-items:center;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px 24px;text-align:center}.ov svg{max-width:100%;height:auto}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 18px;border-radius:20px;font-weight:600;animation:in .3s;z-index:9}
</style>
</head>
<body>
<div id="app"><main id="v"></main><nav id="nav"></nav></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
var CATS=[["food","Продукты","🍎","#E24BDB"],["sub","Подписки","👑","#FB923C"],["med","Медицина","➕","#6C7CFF"],["util","ЖКУ","🏠","#22C7F0"],["trn","Транспорт","🚌","#34D399"],["caf","Кафе","☕","#FACC15"],["fun","Развлечения","🎮","#F472B6"],["shop","Покупки","🛍️","#A78BFA"],["oth","Другое","📦","#8B5CF6"]];
var P={plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',bell:'<path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/>',dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',wal:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 13h2"/>',chev:'<path d="M9 6l6 6-6 6"/>',l:'<path d="M15 6l-6 6 6 6"/>',moon:'<path d="M20 14A8 8 0 019.5 4 8 8 0 1020 14z"/>',card:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>'};
function ic(n){return '<svg class="i" viewBox="0 0 24 24">'+P[n]+'</svg>'}
var S={name:"Максим",start:0,theme:"system",salary:{amount:0,next:""},tx:[],cards:[],wishes:[]};
var tab=0,amt="",cat="food",pr=30,mo=0,db=null,adding=false,wadd=false,wopen=0,ehOpen=0,ccol="#8B5CF6";
var fmt=function(k){return (k/100).toLocaleString("ru-RU",{maximumFractionDigits:2})+" ₽"};
var $=function(i){return document.getElementById(i)};
function openDB(cb){try{var r=indexedDB.open("fin",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){db=r.result;cb()};r.onerror=function(){cb()}}catch(e){cb()}}
function save(){try{if(db)db.transaction("kv","readwrite").objectStore("kv").put(JSON.stringify(S),"s")}catch(e){}}
function load(cb){try{if(!db)return cb();var g=db.transaction("kv").objectStore("kv").get("s");g.onsuccess=function(){if(g.result)try{Object.assign(S,JSON.parse(g.result))}catch(e){}cb()};g.onerror=cb}catch(e){cb()}}
function bal(){return S.tx.reduce(function(a,t){return a+(t.t=="inc"?t.amt:-t.amt)},S.start)-wsaved()}
function cinfo(id){return CATS.filter(function(c){return c[0]==id})[0]||CATS[8]}
function theme(){var r=document.documentElement;if(S.theme=="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme)}
function days(){if(!S.salary.next)return 0;return Math.max(Math.ceil((new Date(S.salary.next+"T00:00")-new Date().setHours(0,0,0,0))/864e5),1)}
function mdate(){var n=new Date();return new Date(n.getFullYear(),n.getMonth()+mo,1)}
function monthExp(){var m=mdate();return S.tx.filter(function(t){var d=new Date(t.ts);return t.t=="exp"&&d.getMonth()==m.getMonth()&&d.getFullYear()==m.getFullYear()})}
function toast(m){var e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},1400)}
function key(k){if(k=="⌫")amt=amt.slice(0,-1);else if(k==","){if(amt.indexOf(",")<0)amt=(amt||"0")+","}else{var p=amt.split(",");if(p[1]&&p[1].length>=2)return;if(amt.length<10)amt+=k}$("a").textContent=(amt||"0")+" ₽"}
function parse(s){return Math.round(parseFloat((s||"0").replace(/[\s\u00a0]/g,"").replace(",","."))*100)||0}
function addExp(){var a=parse(amt);if(a<=0)return toast("Введите сумму");S.tx.push({id:Date.now()+Math.random(),t:"exp",amt:a,cat:cat,note:$("n").value.trim(),ts:Date.now()});amt="";save();toast("Сохранено ✓");render()}
function setCat(c){var k=$("n").value;cat=c;render();$("n").value=k}
function delTx(id){if(confirm("Удалить операцию?")){S.tx=S.tx.filter(function(t){return t.id!=id});save();render()}}
function addInc(){var a=parse(prompt("Сумма дохода, ₽"));if(a>0){S.tx.push({id:Date.now(),t:"inc",amt:a,cat:"inc",note:prompt("Источник","Зарплата")||"Доход",ts:Date.now()});save();render()}}
function flower(){var p="";for(var i=0;i<=160;i++){var a=i/160*2*Math.PI,r=74+7*Math.sin(12*a);p+=(i?"L":"M")+(100+r*Math.cos(a)).toFixed(1)+" "+(100+r*Math.sin(a)).toFixed(1)}return p+"Z"}
function hero(){return '<div class="hero"><svg viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset=".35" stop-color="#E24BDB"/><stop offset=".7" stop-color="#8B5CF6"/><stop offset="1" stop-color="#43C6F5"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="9"/></filter></defs><path d="'+flower()+'" fill="url(#g)" filter="url(#b)" opacity=".8"/><path d="'+flower()+'" fill="url(#g)"/><circle cx="100" cy="100" r="54" fill="var(--core)"/><circle cx="100" cy="100" r="54" fill="none" stroke="url(#g)" stroke-width="1.5" opacity=".6"/><path d="M82 130c-2-10 0-12 3-18-6-4-7-12-5-20 3-14 14-22 26-20 12 2 18 12 16 24l5 8-6 3 2 8-8 2c0 6 1 9 4 13z" fill="#05061a" opacity=".9"/><circle cx="100" cy="150" r="5" fill="#8B5CF6"/></svg></div>'}
function spend(){return '<div class="row"><div><div class="sec">Баланс</div><div style="font-size:26px;font-weight:700">'+fmt(bal())+'</div></div><div class="row"><button class="ib" onclick="tab=4;render()">'+ic("bell")+'</button></div></div>'+hero()+
'<div class="card"><div class="sec" style="text-align:center">Введите сумму</div><input id="a" class="amt" inputmode="decimal" placeholder="0 ₽" value="'+amt+'" oninput="amt=this.value.replace(/[^0-9,.]/g,\'\');this.value=amt" style="text-align:center;border:0;background:none;margin:0;width:100%">'+
'<div class="sec" style="margin-bottom:8px">Выберите категорию</div><div class="cats">'+CATS.map(function(c){return '<button class="cat'+(c[0]==cat?" on":"")+'" onclick="setCat(\''+c[0]+'\')"><div class="ci">'+c[2]+'</div>'+c[1]+'</button>'}).join("")+'</div>'+
'<input id="n" placeholder="Комментарий" enterkeyhint="done"><button class="btn" onclick="addExp()">Сохранить</button></div>'}
function donut(by,ks,tot){var R=62,C=2*Math.PI*R,off=0,s='<svg viewBox="0 0 160 160" width="150" height="150" style="transform:rotate(-90deg);flex:none"><defs><filter id="d"><feGaussianBlur stdDeviation="3"/></filter></defs>';
ks.forEach(function(k){var l=by[k]/tot*C;s+='<circle cx="80" cy="80" r="'+R+'" fill="none" stroke="'+cinfo(k)[3]+'" stroke-width="24" stroke-dasharray="'+Math.max(l-2,0)+' '+(C-l+2)+'" stroke-dashoffset="'+(-off)+'"/>';off+=l});
return s+'</svg>'}
function rows(arr){if(!arr.length)return '<div class="sec" style="padding:10px 0">Пока нет операций</div>';return arr.map(function(t){var c=cinfo(t.cat),inc=t.t=="inc",d=new Date(t.ts);return '<div class="tx"><div class="ico" style="background:'+(inc?"#22c55e":c[3])+'"><span style="filter:grayscale(1) brightness(8)">'+(inc?"💰":c[2])+'</span></div><div class="m"><div>'+esc(t.note||(inc?"Доход":c[1]))+'</div><div class="sec">'+(inc?"Доход":c[1])+' · '+d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})+'</div></div><b class="'+(inc?"pos":"neg")+'">'+(inc?"+":"− ")+fmt(t.amt)+'</b><button class="del" onclick="delTx('+t.id+')">✕</button></div>'}).join("")}
function list(){var me=monthExp(),tot=me.reduce(function(a,t){return a+t.amt},0),m=mdate(),dn=mo==0?new Date().getDate():new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
var by={};me.forEach(function(t){by[t.cat]=(by[t.cat]||0)+t.amt});var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
var q=($("q")&&$("q").value||"").toLowerCase();
var arr=S.tx.slice().sort(function(a,b){return b.ts-a.ts}).filter(function(t){return !q||(t.note+cinfo(t.cat)[1]).toLowerCase().indexOf(q)>=0}).slice(0,60);
var mn=m.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});mn=mn[0].toUpperCase()+mn.slice(1);
return '<h1>Все расходы</h1><div class="row" style="margin-bottom:10px"><button class="ib" onclick="mo--;render()">'+ic("l")+'</button><b>'+mn+'</b><button class="ib" onclick="mo++;render()">'+ic("chev")+'</button></div>'+
'<div class="card"><div class="big">'+fmt(tot)+'</div><div class="sec">Общие расходы · '+fmt(Math.round(tot/dn))+' в день · операций: '+me.length+'</div>'+(ks.length?'<div class="row" style="margin-top:12px">'+donut(by,ks,tot)+'<div style="flex:1;min-width:0">'+ks.slice(0,5).map(function(k){return '<div class="leg"><i style="background:'+cinfo(k)[3]+'"></i><span>'+cinfo(k)[1]+'</span><u>'+Math.round(by[k]/tot*100)+'%</u><b>'+fmt(by[k])+'</b></div>'}).join("")+'</div></div>':'')+'</div>'+
'<input id="q" placeholder="Поиск" oninput="filt()" value="'+q+'"><div class="card" style="padding:6px 16px"><div class="row" style="padding-top:8px"><h3>Последние траты</h3></div><div id="l">'+rows(arr)+'</div></div>'}
function filt(){var q=$("q").value.toLowerCase();$("l").innerHTML=rows(S.tx.slice().sort(function(a,b){return b.ts-a.ts}).filter(function(t){return !q||(t.note+cinfo(t.cat)[1]).toLowerCase().indexOf(q)>=0}).slice(0,60))}
function stats(){var now=Date.now(),from=now-pr*864e5,ex=S.tx.filter(function(t){return t.t=="exp"&&t.ts>=from}),inc=S.tx.filter(function(t){return t.t=="inc"&&t.ts>=from});
var tot=ex.reduce(function(a,t){return a+t.amt},0),ti=inc.reduce(function(a,t){return a+t.amt},0);
var by={};ex.forEach(function(t){by[t.cat]=(by[t.cat]||0)+t.amt});var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
var pts=[],i;for(i=0;i<8;i++){var t0=now-(7-i)*pr/7*864e5;pts.push(S.tx.reduce(function(a,t){return t.ts<=t0?a+(t.t=="inc"?t.amt:-t.amt):a},S.start))}
var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),rg=(mx-mn)||1,xy=pts.map(function(v,i){return [10+i*40,100-(v-mn)/rg*80]});
var line=xy.map(function(p,i){return (i?"L":"M")+p[0]+" "+p[1]}).join(" ");
var h='<h1>Аналитика</h1><div class="seg">'+[[7,"Неделя"],[30,"Месяц"],[91,"Квартал"],[365,"Год"]].map(function(p){return '<button class="'+(pr==p[0]?"on":"")+'" onclick="pr='+p[0]+';render()">'+p[1]+'</button>'}).join("")+'</div>';
h+='<div class="card"><div class="sec">Баланс</div><div class="big">'+fmt(bal())+'</div><svg viewBox="0 0 300 115" width="100%" style="margin-top:6px"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".6"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#C56BFF"/></linearGradient></defs><path d="'+line+' L290 110 L10 110Z" fill="url(#ar)"/><path d="'+line+'" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+xy.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#C56BFF" stroke="#fff" stroke-width="1.5"/>'}).join("")+'</svg></div>';
h+='<div class="row" style="gap:12px;align-items:stretch"><div class="card" style="flex:1"><div class="sec">Расходы</div><div style="font-size:20px;font-weight:700">'+fmt(tot)+'</div></div><div class="card" style="flex:1"><div class="sec">Доходы</div><div style="font-size:20px;font-weight:700">'+fmt(ti)+'</div><div class="pos" style="font-size:12px">'+(ti?Math.round((ti-tot)/ti*100)+"% накоплено":"")+'</div></div></div>';
h+='<div class="card"><h3>Категории расходов</h3>'+(ks.length?ks.map(function(k){var p=Math.round(by[k]/tot*100);return '<div class="hb"><span>'+cinfo(k)[1]+'</span><s><i style="width:'+p+'%;background:'+cinfo(k)[3]+'"></i></s><em>'+p+'%</em></div>'}).join(""):'<div class="sec">Нет расходов за период</div>')+'</div>';
if(ks.length)h+='<div class="card"><h3>Инсайты</h3><div class="sec">Самая затратная категория — <b style="color:var(--tx)">'+cinfo(ks[0])[1]+'</b>. Средний расход в день — '+fmt(Math.round(tot/pr))+'.'+(by.sub?'<br>Подписки — '+Math.round(by.sub/tot*100)+'% расходов.':'')+(S.salary.next?'<br>В этом темпе к зарплате останется '+fmt(Math.round(bal()-tot/pr*days()))+'.':'')+'</div></div>';return h}
function prof(){var d=days(),b=bal(),sb=salBase(),tot=Math.max(sb,1),spent=Math.max(tot-b,0);
return '<div class="row"><h1>Личный кабинет</h1></div><div class="card row"><div class="row" style="gap:12px"><div style="width:52px;height:52px;border-radius:50%;background:conic-gradient(#FF8A3D,#E24BDB,#8B5CF6,#43C6F5,#FF8A3D);display:grid;place-items:center"><div style="width:44px;height:44px;border-radius:50%;background:var(--core);display:grid;place-items:center">'+ic("user")+'</div></div><div><b style="font-size:18px">'+esc(S.name)+'</b><div class="sec">Всё под контролем</div></div></div><button class="ib" onclick="var n=prompt(\'Имя\',S.name);if(n){S.name=n;save();render()}">✎</button></div>'+
'<div class="card"><div class="sec">Общий баланс</div><div class="big">'+fmt(b)+'</div></div>'+
'<div class="card"><div class="sec">Сколько могу потратить<br>до зарплаты</div><div class="big" style="margin-top:6px">'+(S.salary.next?fmt(Math.max(b,0)):'—')+'</div>'+(S.salary.next?'<div class="bar"><i style="width:'+Math.min(100,Math.max(0,b/(tot||1)*100))+'%"></i></div><div class="sec">из '+fmt(tot)+' · осталось '+d+' дн. · лимит '+fmt(Math.round(b/d))+' в день</div>':'<div class="sec" style="margin-top:6px">Укажите дату следующей зарплаты</div>')+'<input type="date" value="'+S.salary.next+'" onchange="S.salary.next=this.value;S.salary.base=null;save();render()" style="margin-top:10px;margin-bottom:0"></div>'+
'<div class="tiles"><button onclick="addInc()">'+ic("dl")+'Доходы</button><button onclick="var v=prompt(\'Текущий баланс, ₽\');if(v!==null){S.start+=parse(v)-bal();save();render()}">'+ic("wal")+'Баланс</button><button onclick="share()">'+ic("up")+'Поделиться</button></div>'+
'<button class="lr" style="background:linear-gradient(160deg,rgba(139,92,246,.35),rgba(139,92,246,.08));margin-bottom:14px" onclick="tab=5;render()">✨ Мои желания'+ic("chev")+'</button><div class="sec" style="margin:0 4px 8px">Настройки</div><div class="seg">'+[["system","Системная"],["light","Светлая"],["dark","Тёмная"]].map(function(t){return '<button class="'+(S.theme==t[0]?"on":"")+'" onclick="S.theme=\''+t[0]+'\';theme();save();render()">'+t[1]+'</button>'}).join("")+'</div>'+
'<button class="lr" onclick="exp()">Скачать бэкап в файл'+ic("chev")+'</button><button class="lr" onclick="$(\'f\').click()">Добавить из файла'+ic("chev")+'</button><input type="file" id="f" accept=".json" style="display:none" onchange="imp(this)"><button class="lr" onclick="if(confirm(\'Удалить все данные?\')){S.tx=[];S.start=0;S.salary={amount:0,next:\'\'};save();render()}">Сбросить данные'+ic("chev")+'</button>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
var COLS=["#8B5CF6","#E24BDB","#22C7F0","#34D399","#FB923C","#EF4444"];
function setCol(i){ccol=COLS[i];document.querySelectorAll(".sw").forEach(function(e,j){e.style.outline=j==i?"2px solid var(--tx)":"none"})}
function cards(){var h='<h1>Карты лояльности</h1>';
if(adding){h+='<div class="card"><input id="cn" placeholder="Название (например, Пятёрочка)"><input id="cnum" placeholder="Номер карты / штрихкод"><select id="cf" style="width:100%;background:var(--c2);border:1px solid var(--bd);border-radius:14px;padding:12px;color:var(--tx);font-size:16px;margin:4px 0 10px"><option value="CODE128">Code 128 (универсальный)</option><option value="EAN13">EAN-13</option><option value="EAN8">EAN-8</option><option value="CODE39">Code 39</option><option value="QR">QR-код</option></select><div class="row" style="justify-content:flex-start;margin-bottom:12px">'+COLS.map(function(c,i){return '<button class="sw" onclick="setCol('+i+')" style="width:32px;height:32px;border-radius:50%;border:0;background:'+c+';outline:'+(c==ccol?"2px solid var(--tx)":"none")+'"></button>'}).join("")+'</div><button class="btn" onclick="addCard()">Сохранить</button><button class="btn ghost" style="margin-top:8px" onclick="adding=false;render()">Отмена</button></div>'}
else h+='<button class="btn" style="margin-bottom:14px" onclick="adding=true;render()">+ Добавить карту</button>';
h+=S.cards.length?S.cards.map(function(c){return '<div class="lc" style="background:linear-gradient(135deg,'+c.col+',#151A43)" onclick="openCard('+c.id+')"><div class="row"><b style="font-size:18px">'+esc(c.name)+'</b><button class="del" style="color:#fff" onclick="event.stopPropagation();delCard('+c.id+')">✕</button></div><div class="row"><span style="letter-spacing:2px">'+esc(c.num)+'</span><span class="sec" style="color:#fff;opacity:.8">Показать штрихкод</span></div></div>'}).join(""):'<div class="sec" style="text-align:center;padding:20px">Карт пока нет</div>';return h}
function addCard(){var n=$("cn").value.trim(),num=$("cnum").value.trim(),f=$("cf").value;if(!n||!num)return toast("Заполните название и номер");var ok=true;try{if(f!="QR"&&window.JsBarcode)JsBarcode(document.createElementNS("http://www.w3.org/2000/svg","svg"),num,{format:f,valid:function(v){ok=v}})}catch(e){ok=false}if(!ok)return toast("Номер не подходит для формата");S.cards.push({id:Date.now(),name:n,num:num,fmt:f,col:ccol});adding=false;save();render()}
function delCard(id){if(confirm("Удалить карту?")){S.cards=S.cards.filter(function(c){return c.id!=id});save();render()}}
function openCard(id){var c=S.cards.filter(function(x){return x.id==id})[0];if(!c)return;var o=document.createElement("div");o.className="ov";o.innerHTML='<b style="font-size:22px">'+esc(c.name)+'</b><svg id="bc"></svg><div style="font-size:18px;letter-spacing:2px">'+esc(c.num)+'</div><div style="color:#777;font-size:13px">Нажмите, чтобы закрыть</div>';o.onclick=function(){o.remove()};document.body.appendChild(o);try{if(c.fmt=="QR")qrDraw($("bc"),c.num);else JsBarcode("#bc",c.num,{format:c.fmt,displayValue:false,width:3,height:120,margin:0})}catch(e){o.insertAdjacentHTML("beforeend",'<div style="color:#c00">Штрихкод недоступен. Проверьте интернет</div>')}}
function salBase(){var s=S.salary;if(s.base==null){s.base=bal();s.since=Date.now();s.ws0=wsaved();save()}var inc=S.tx.filter(function(t){return t.t=="inc"&&t.ts>s.since}).reduce(function(a,t){return a+t.amt},0);return s.base+inc-(wsaved()-s.ws0)}
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function mkPlan(rem,dl){var n0=new Date(),y=n0.getFullYear(),m=n0.getMonth(),d=n0.getDate(),end=new Date(dl+"T00:00"),ds=[],i=0;while(i<120){var x=new Date(y,m+i,1);x.setDate(Math.min(d,new Date(y,m+i+1,0).getDate()));if(x>=end&&i>0)break;ds.push(x);i++}var n=ds.length,per=Math.floor(rem/n);return ds.map(function(x,j){return {d:iso(x),amt:j==n-1?rem-per*(n-1):per,done:false}})}
function wsaved(){return (S.wishes||[]).reduce(function(a,w){return a+w.plan.reduce(function(b,p){return b+(p.done?p.amt:0)},0)},0)}
function wsv(w){return w.have+w.plan.reduce(function(b,p){return b+(p.done?p.amt:0)},0)}
function fd(s){return new Date(s+"T00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short",year:"numeric"})}
function addWish(){var n=$("wn").value.trim(),t=parse($("wt").value),dl=$("wd").value,h=parse($("wh").value);if(!n||t<=0||!dl)return toast("Заполните название, сумму и срок");if(new Date(dl+"T00:00")<=new Date().setHours(0,0,0,0))return toast("Срок должен быть в будущем");var w={id:Date.now(),name:n,target:t,have:h,dl:dl,plan:mkPlan(Math.max(t-h,0),dl)};S.wishes.push(w);wadd=false;wopen=w.id;save();render()}
function editHave(id){var w=S.wishes.filter(function(x){return x.id==id})[0],v=$("eh").value;w.have=parse(v);var un=w.plan.filter(function(p){return !p.done}),dn=w.plan.reduce(function(a,p){return a+(p.done?p.amt:0)},0);if(un.length){var rem=Math.max(w.target-w.have-dn,0),per=Math.floor(rem/un.length);un.forEach(function(p,j){p.amt=j==un.length-1?rem-per*(un.length-1):per})}save();wopen=id;ehOpen=0;render()}
function delWish(id){if(confirm("Удалить желание? Отмеченные пополнения вернутся в баланс.")){S.wishes=S.wishes.filter(function(w){return w.id!=id});save();render()}}
function tog(id,i){var w=S.wishes.filter(function(x){return x.id==id})[0];w.plan[i].done=!w.plan[i].done;save();wopen=id;render();if(w.plan[i].done&&wsv(w)>=w.target)toast("Цель достигнута 🎉")}
function wishes(){var h='<div class="row"><button class="ib" onclick="tab=4;render()">'+ic("l")+'</button><h1 style="margin:0">Мои желания</h1><span style="width:38px"></span></div><div style="height:14px"></div>';
if(wadd)h+='<div class="card"><input id="wn" placeholder="Что хочу (например, Отпуск)"><input id="wt" inputmode="decimal" placeholder="Сколько нужно, ₽"><div class="sec">Срок</div><input id="wd" type="date"><input id="wh" inputmode="decimal" placeholder="Уже накоплено, ₽ (необязательно)"><button class="btn" onclick="addWish()">Рассчитать и создать</button><button class="btn ghost" style="margin-top:8px" onclick="wadd=false;render()">Отмена</button></div>';
else h+='<button class="btn" style="margin-bottom:14px" onclick="wadd=true;render()">+ Новое желание</button>';
if(!S.wishes.length)return h+'<div class="sec" style="text-align:center;padding:20px">Пока нет желаний</div>';
return h+S.wishes.map(function(w){var sv=wsv(w),p=Math.min(100,Math.round(sv/w.target*100)),nx=w.plan.filter(function(x){return !x.done})[0],open=wopen==w.id;
var c='<div class="card"><div onclick="ehOpen=0;wopen='+(open?0:w.id)+';render()"><div class="row"><b style="font-size:18px">'+esc(w.name)+'</b><span class="sec">'+p+'%</span></div><div class="sec">цель '+fmt(w.target)+' · до '+fd(w.dl)+'</div><div class="bar"><i style="width:'+(sv>0?Math.max(2,Math.min(100,sv/w.target*100)):0)+'%"></i></div><div class="row"><span class="sec">Накоплено '+fmt(sv)+'</span><span class="sec">Осталось '+fmt(Math.max(w.target-sv,0))+'</span></div>'+(w.plan.length&&sv<w.target?'<div style="margin-top:10px;font-size:20px;font-weight:700">≈ '+fmt(w.plan[0].amt)+' <span class="sec" style="font-weight:400">в месяц · '+w.plan.length+' взносов</span></div>'+(nx?'<div class="sec">Следующее: '+fd(nx.d)+' — '+fmt(nx.amt)+'</div>':''):'<div class="pos" style="margin-top:10px">Цель достигнута 🎉</div>')+'</div>';
if(open){var n=w.plan.length,cum=w.have,bw=Math.max(2,Math.min(28,Math.floor(280/n)-3)),gap=(280-bw*n)/(n+1);
c+=(ehOpen==w.id?'<div class="sec" style="margin-top:14px">Уже накоплено, ₽ — изменение повлияет на прогресс и план</div><div class="row" style="gap:8px"><input id="eh" inputmode="decimal" value="'+(w.have/100).toString().replace(".",",")+'" style="margin:0"><button class="btn" style="width:auto;padding:11px 16px;font-size:14px" onclick="editHave('+w.id+')">Сохранить</button><button class="btn ghost" style="width:auto;padding:11px 14px;font-size:14px" onclick="ehOpen=0;render()">Отмена</button></div>':'<div class="row" style="margin-top:14px"><span class="sec">Стартовая сумма: '+fmt(w.have)+'</span><button class="btn ghost" style="width:auto;padding:7px 12px;font-size:13px" onclick="ehOpen='+w.id+';render()">Изменить</button></div>');c+='<svg viewBox="0 0 300 100" width="100%" style="margin-top:14px"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C56BFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs><line x1="10" x2="290" y1="10" y2="10" stroke="#43C6F5" stroke-dasharray="4 4"/>'+w.plan.map(function(q,i){cum+=q.amt;var hh=Math.max(3,Math.min(1,cum/w.target)*80),fh=Math.min(Math.min(cum,sv)/w.target,1)*80,bx=10+gap*(i+1)+bw*i;return '<rect x="'+bx+'" y="'+(90-hh)+'" width="'+bw+'" height="'+hh+'" rx="3" fill="rgba(139,92,246,.18)" stroke="#8B5CF6" stroke-width="1"/>'+(fh>0.5?'<rect x="'+bx+'" y="'+(90-fh)+'" width="'+bw+'" height="'+fh+'" rx="3" fill="url(#wg)"/>':'')}).join("")+'</svg><div class="sec" style="margin:4px 0 8px">Закрашено — накоплено фактически, контур — план (пунктир — цель)</div>'+w.plan.map(function(q,i){var late=!q.done&&new Date(q.d+"T00:00")<new Date().setHours(0,0,0,0);return '<div class="row" style="padding:9px 0;border-top:1px solid var(--bd)"><span style="flex:1;color:'+(late?"var(--bad)":"var(--tx)")+'">'+fd(q.d)+(late?" · просрочено":"")+'</span><b>'+fmt(q.amt)+'</b><input type="checkbox" '+(q.done?"checked":"")+' onchange="tog('+w.id+','+i+')" style="width:26px;height:26px;margin:0;padding:0;accent-color:#8B5CF6"></div>'}).join("")+'<button class="btn ghost" style="margin-top:12px;padding:11px;font-size:14px" onclick="delWish('+w.id+')">Удалить желание</button>'}
return c+'</div>'}).join("")}
function qrDraw(svg,t){var q=qrcode(0,"M");q.addData(t);q.make();var n=q.getModuleCount(),m=3,d="",r,c;for(r=0;r<n;r++)for(c=0;c<n;c++)if(q.isDark(r,c))d+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";var s=n+2*m;svg.setAttribute("viewBox","0 0 "+s+" "+s);svg.setAttribute("width","260");svg.setAttribute("height","260");svg.innerHTML='<rect width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+d+'" fill="#000" shape-rendering="crispEdges"/>'}
function share(){var f=new File([JSON.stringify(S)],"finance-backup.json",{type:"application/json"});try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Бэкап финансов"}).catch(function(e){if(e.name!="AbortError")exp()});return}}catch(e){}exp()}
function exp(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="finance-backup.json";a.click()}
function imp(i){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;if(confirm("Объединить с текущими данными?\nОК — объединить, Отмена — заменить полностью")){var ids={};S.tx.forEach(function(t){ids[t.id]=1});d.tx.forEach(function(t){if(!ids[t.id])S.tx.push(t)});var cd={};S.cards.forEach(function(c){cd[c.id]=1});(d.cards||[]).forEach(function(c){if(!cd[c.id])S.cards.push(c)});var wd={};S.wishes.forEach(function(w){wd[w.id]=1});(d.wishes||[]).forEach(function(w){if(!wd[w.id])S.wishes.push(w)});S.start=S.start||d.start||0;if(!S.salary.next&&d.salary)S.salary=d.salary}else{S=Object.assign({cards:[],wishes:[]},d)}save();theme();render();toast("Данные добавлены ✓")}catch(e){toast("Неверный файл")}};r.readAsText(f)}
function render(){$("v").innerHTML=[spend,list,stats,cards,prof,wishes][tab]();$("v").style.animation="none";void $("v").offsetWidth;$("v").style.animation="";
$("nav").innerHTML=[["plus","Трата"],["list","Расходы"],["chart","Аналитика"],["card","Карты"],["user","ЛК"]].map(function(t,i){return '<button class="'+(i==(tab==5?4:tab)?"on":"")+'" onclick="tab='+i+';render()">'+ic(t[0])+t[1]+'</button>'}).join("")}
openDB(function(){load(function(){theme();render()})});
</script>
